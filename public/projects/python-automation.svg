  <rect x="50" y="170" width="470" height="230" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
  <text x="100" y="200" font-family="system-ui" font-size="16" font-weight="600" fill="#e5e7eb">Data Cleaning Pipeline</text>
  <rect x="80" y="220" width="130" height="50" rx="6" fill="#7f22fe" fill-opacity="0.2" stroke="#7f22fe" stroke-width="2"/>
  <text x="145" y="253" text-anchor="middle" font-family="system-ui" font-size="12" fill="#ffffff">Raw Data</text>
  <path d="M210 245 L240 245" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="240" y="220" width="130" height="50" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
  <text x="305" y="253" text-anchor="middle" font-family="system-ui" font-size="12" fill="#ffffff">Validate</text>
  <path d="M370 245 L400 245" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="220" width="130" height="50" rx="6" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2"/>
  <text x="465" y="253" text-anchor="middle" font-family="system-ui" font-size="12" fill="#ffffff">Clean</text>
  <path d="M530 245 L560 245" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="80" y="290" width="420" height="100" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="100" y="310" font-family="system-ui" font-size="12" fill="#94a3b8">import pandas as pd</text>
  <text x="100" y="330" font-family="system-ui" font-size="12" fill="#94a3b8">df = pd.read_csv('data.csv')</text>
  <text x="100" y="350" font-family="system-ui" font-size="12" fill="#94a3b8">df = df.dropna().drop_duplicates()</text>
  <text x="100" y="370" font-family="system-ui" font-size="12" fill="#94a3b8">df.to_parquet('clean_data.parquet')</text>

  <rect x="550" y="170" width="200" height="230" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
